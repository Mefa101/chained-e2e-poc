# POC replica of google-gemini/gemini-cli's trigger_e2e.yml
# Deploy this on the MAIN branch of a repo YOU OWN. Mirrors the real
# mechanism 1:1, no functional changes.
name: 'Trigger E2E (POC)'

on:
  workflow_dispatch:
  pull_request:

jobs:
  save_repo_name:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Save Repo name'
        env:
          REPO_NAME: '${{ github.event.pull_request.head.repo.full_name }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          mkdir -p ./pr
          echo "${REPO_NAME}" > ./pr/repo_name
          echo "${HEAD_SHA}" > ./pr/head_sha
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'repo_name'
          path: 'pr/'
